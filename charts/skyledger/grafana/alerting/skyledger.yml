# skyledger no longer ships alert rules. Grafana keeps rules a provisioning file
# created even after the file is gone, so this file deletes the four that earlier
# versions provisioned. It can be removed once upgrades from 0.4.x are no longer
# supported.
apiVersion: 1
deleteRules:
  - orgId: 1
    uid: skyledger-receiver-down
  - orgId: 1
    uid: skyledger-no-messages
  - orgId: 1
    uid: skyledger-import-stale
  - orgId: 1
    uid: skyledger-gps-degraded
