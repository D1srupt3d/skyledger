# Dashboards are files generated by tools/gen_dashboards.py. Not editable in
# place, so an upgrade never overwrites your changes: use "Save as" to make your
# own copy and edit that.
apiVersion: 1
providers:
  - name: skyledger
    folder: Skyledger
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards
