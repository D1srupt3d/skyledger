{{- $root := . }}
{{- range $component := list "ingest" "history" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skyledger.fullname" $root }}-{{ $component }}
  labels:
    {{- include "skyledger.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  # Exactly one: two ingests store every position twice, two histories
  # import the same files.
  replicas: 1
  strategy:
    type: Recreate
  {{- if eq $component "history" }}
  # The first import can run for hours; the 600 s default fails the rollout and ArgoCD shows Degraded.
  progressDeadlineSeconds: 86400
  {{- end }}
  selector:
    matchLabels:
      {{- include "skyledger.selector" (dict "root" $root "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "skyledger.selector" (dict "root" $root "component" $component) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- if not $root.Values.existingSecret }}
        checksum/secret: {{ include (print $root.Template.BasePath "/secret.yaml") $root | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "skyledger.podSecurity" (dict "uid" 10001) | nindent 8 }}
      initContainers:
        # migrate takes a Postgres advisory lock, so the two Deployments never clash.
        - name: migrate
          image: {{ include "skyledger.image" $root }}
          args: [migrate]
          envFrom:
            - configMapRef:
                name: {{ include "skyledger.fullname" $root }}
          env:
            {{- include "skyledger.secretEnv" (dict "root" $root "key" "POSTGRES_PASSWORD") | nindent 12 }}
            {{- if $root.Values.timescaledb.enabled }}
            # Bundled database only: migrate sets the Grafana login's password.
            # On your own database that login is yours to manage.
            {{- include "skyledger.secretEnv" (dict "root" $root "key" "GRAFANA_DB_PASSWORD") | nindent 12 }}
            {{- end }}
            {{- with $root.Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- include "skyledger.containerSecurity" $root | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with $root.Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ include "skyledger.image" $root }}
          args: [{{ $component }}]
          envFrom:
            - configMapRef:
                name: {{ include "skyledger.fullname" $root }}
          env:
            {{- include "skyledger.secretEnv" (dict "root" $root "key" "POSTGRES_PASSWORD") | nindent 12 }}
            {{- with $root.Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- include "skyledger.containerSecurity" $root | nindent 12 }}
          {{- if eq $component "ingest" }}
          # alive: the poll loop isn't hung. ready: a write succeeded recently.
          livenessProbe:
            exec:
              command: [sh, -c, 'test -n "$(find /tmp/alive -mmin -2)"']
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command: [sh, -c, 'test -n "$(find /tmp/ready -mmin -2)"']
            periodSeconds: 30
          {{- else }}
          # The first run imports all history and rebuilds flights over it, which
          # can outlast the liveness window; liveness is armed only after it.
          startupProbe:
            exec:
              command: [sh, -c, 'test -f /tmp/ready']
            periodSeconds: 60
            failureThreshold: 1440
          # alive is touched every minute asleep, per imported day, and before the
          # aircraft DB load and flights rebuild. A rebuild outliving this window
          # restarts the pod and skips the rebuild; 180 min leaves room.
          livenessProbe:
            exec:
              command: [sh, -c, 'test -n "$(find /tmp/alive -mmin -180)"']
            periodSeconds: 60
          # ready after each successful nightly run; 25 h so one missed night shows.
          readinessProbe:
            exec:
              command: [sh, -c, 'test -n "$(find /tmp/ready -mmin -1500)"']
            periodSeconds: 60
          {{- end }}
          {{- with (get $root.Values.resources $component) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with $root.Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with $root.Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
