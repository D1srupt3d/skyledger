{{- if not .Values.existingSecret }}
{{- $name := include "skyledger.fullname" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- /* Memoized on .Values: each include of this template (the checksum annotations) would
otherwise draw new random values and hash a Secret that is never applied. */}}
{{- $gen := .Values.generatedSecret | default dict }}
{{- range $key := list "POSTGRES_PASSWORD" "GRAFANA_DB_PASSWORD" "GRAFANA_ADMIN_PASSWORD" }}
{{- if not (hasKey $gen $key) }}
{{- $_ := set $gen $key (get $old $key | default (randAlphaNum 32 | b64enc)) }}
{{- end }}
{{- end }}
{{- $_ := set .Values "generatedSecret" $gen }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "skyledger.labels" . | nindent 4 }}
  annotations:
    # The database volume outlives an uninstall, and its password must still
    # match on reinstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  # lookup keeps the first install's values; offline renders (helm template,
  # ArgoCD) can't see them, hence existingSecret for GitOps.
  {{- range $key := keys $gen | sortAlpha }}
  {{ $key }}: {{ get $gen $key }}
  {{- end }}
{{- end }}
