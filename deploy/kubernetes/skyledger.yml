# skyledger's two services. Each runs `skyledger migrate` first as an init
# container; migrate takes a Postgres advisory lock, so the two never clash.
# Bring your own TimescaleDB (community edition); README "Kubernetes".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyledger-ingest
  labels: {app.kubernetes.io/name: skyledger, app.kubernetes.io/component: ingest}
spec:
  # Two would store every position twice.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: skyledger, app.kubernetes.io/component: ingest}
  template:
    metadata:
      labels: {app.kubernetes.io/name: skyledger, app.kubernetes.io/component: ingest}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: migrate
          image: ghcr.io/d1srupt3d/skyledger:0.2.0
          args: [migrate]
          envFrom: [{configMapRef: {name: skyledger}}, {secretRef: {name: skyledger-db}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      containers:
        - name: ingest
          image: ghcr.io/d1srupt3d/skyledger:0.2.0
          args: [ingest]
          envFrom: [{configMapRef: {name: skyledger}}, {secretRef: {name: skyledger-db}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          # alive: the poll loop isn't hung. ready: a write succeeded recently.
          livenessProbe:
            exec: {command: [sh, -c, 'test -n "$(find /tmp/alive -mmin -2)"']}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec: {command: [sh, -c, 'test -n "$(find /tmp/ready -mmin -2)"']}
            periodSeconds: 30
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyledger-history
  labels: {app.kubernetes.io/name: skyledger, app.kubernetes.io/component: history}
spec:
  # Two would import the same files at once.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: skyledger, app.kubernetes.io/component: history}
  template:
    metadata:
      labels: {app.kubernetes.io/name: skyledger, app.kubernetes.io/component: history}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: migrate
          image: ghcr.io/d1srupt3d/skyledger:0.2.0
          args: [migrate]
          envFrom: [{configMapRef: {name: skyledger}}, {secretRef: {name: skyledger-db}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      containers:
        - name: history
          image: ghcr.io/d1srupt3d/skyledger:0.2.0
          args: [history]
          envFrom: [{configMapRef: {name: skyledger}}, {secretRef: {name: skyledger-db}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          # The first run imports every day of history and rebuilds flights over all of
          # it, which can outlast the liveness window; liveness is armed only after it.
          startupProbe:
            exec: {command: [sh, -c, 'test -f /tmp/ready']}
            periodSeconds: 60
            failureThreshold: 1440
          # alive is touched every minute asleep, every imported day, and before the
          # aircraft DB load and flights rebuild. If one nightly rebuild ever outlives
          # this window the pod restarts, skips the rebuild (the day is already
          # imported) and flights silently stop updating; 180 min leaves room.
          # ponytail: fixed window, raise it if a rebuild ever trips it.
          livenessProbe:
            exec: {command: [sh, -c, 'test -n "$(find /tmp/alive -mmin -180)"']}
            periodSeconds: 60
          # ready after each successful nightly run; 25 h so one missed night shows.
          readinessProbe:
            exec: {command: [sh, -c, 'test -n "$(find /tmp/ready -mmin -1500)"']}
            periodSeconds: 60
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
