name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg18.6-ts2.30.1
        env:
          POSTGRES_USER: skyledger
          POSTGRES_PASSWORD: test
          POSTGRES_DB: skyledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skyledger -d skyledger"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Chart lint and schema check, every mode
        run: |
          set -euo pipefail
          modes=(
            "--set tar1090Url=http://rx/"
            "--set tar1090Url=http://rx/ --set timescaledb.enabled=false --set database.host=db"
            "--set tar1090Url=http://rx/ --set grafana.enabled=false"
            "--set demo.enabled=true --set grafana.ingress.enabled=true --set grafana.ingress.host=sky.example"
            "-f tests/unit/values-homelab.yaml"
          )
          for m in "${modes[@]}"; do
            helm lint --strict charts/skyledger $m
            helm template skyledger charts/skyledger $m > "$RUNNER_TEMP/render.yaml"
            docker run --rm -v "$RUNNER_TEMP:/w" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary /w/render.yaml
          done
      - run: uv run ruff check
      - name: Dashboards match the generator
        run: uv run python tools/gen_dashboards.py --check
      - name: Scrub (generic checks)
        run: bash tools/scrub_check.sh
      - name: Tests, including the integration test against TimescaleDB
        run: uv run pytest -v
        env:
          SKYLEDGER_TEST_DSN: postgresql://skyledger:test@localhost:5432/skyledger

  # Installs the full stack on a throwaway cluster with the demo feed: the
  # only test that proves pods, probes, the database and Grafana fit together.
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - name: Build the image from this commit and load it into kind
        run: |
          docker build -t ghcr.io/d1srupt3d/skyledger:ci .
          kind load docker-image ghcr.io/d1srupt3d/skyledger:ci --name chart-testing
      - name: Install the full stack with the demo feed
        run: >-
          helm install skyledger charts/skyledger --namespace skyledger --create-namespace
          --set image.tag=ci --set demo.enabled=true
          --set timescaledb.storage.size=1Gi --set grafana.persistence.size=256Mi
          --wait --timeout 15m
      - name: Positions arrived, Grafana's datasource is healthy and its dashboards are provisioned
        run: |
          set -euo pipefail
          n=$(kubectl -n skyledger exec statefulset/skyledger-timescaledb -- psql -U skyledger -d skyledger -Atc "SELECT count(*) FROM positions")
          echo "positions: $n"; test "$n" -gt 0
          kubectl -n skyledger port-forward svc/skyledger-grafana 3000:3000 >/dev/null 2>&1 &
          for i in $(seq 30); do curl -fs http://localhost:3000/api/health >/dev/null && break; sleep 2; done
          pw=$(kubectl -n skyledger get secret skyledger -o jsonpath='{.data.GRAFANA_ADMIN_PASSWORD}' | base64 -d)
          curl -fsS -u "admin:$pw" http://localhost:3000/api/datasources/uid/skyledger/health | tee health.json
          grep -q '"status":"OK"' health.json
          # All three dashboards carry the skyledger tag and a skyledger- uid.
          curl -fsS -u "admin:$pw" 'http://localhost:3000/api/search?type=dash-db&tag=skyledger' > dashboards.json
          n=$(grep -o '"uid":"skyledger-' dashboards.json | wc -l || true)
          echo "dashboards: $n"; test "$n" -eq 3
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n skyledger get pods -o wide
          kubectl -n skyledger get pvc
          kubectl -n skyledger get events --sort-by=.lastTimestamp
          kubectl -n skyledger describe pods
          kubectl -n skyledger logs --all-containers --prefix -l app.kubernetes.io/name=skyledger --tail=100

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: skyledger:ci
