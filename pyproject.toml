[project]
name = "skyledger"
version = "0.2.0"
description = "Archive a readsb/tar1090 ADS-B receiver in TimescaleDB, including its heatmap replay history, with Grafana dashboards."
authors = [{ name = "D1srupt3d" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3,<4",
]

[project.scripts]
skyledger = "skyledger.__main__:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
# Panel SQL reads better as whole lines than split mid-string.
"tools/gen_dashboards.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a TimescaleDB at SKYLEDGER_TEST_DSN"]
