# skyledger. Configure in .env (copy .env.example), then: docker compose up -d
name: skyledger

x-skyledger: &skyledger
  image: ghcr.io/d1srupt3d/skyledger:${SKYLEDGER_VERSION:-0.2}
  restart: unless-stopped
  environment:
    TAR1090_URL: ${TAR1090_URL:?set TAR1090_URL in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    TZ: ${TZ:-UTC}
    RETENTION_DAYS: ${RETENTION_DAYS:-90}
    HISTORY_AT: ${HISTORY_AT:-01:15}
    HISTORY_START: ${HISTORY_START:-auto}
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18.6-ts2.30.1
    restart: unless-stopped
    # TimescaleDB phones home by default; skyledger turns that off.
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    environment:
      POSTGRES_USER: skyledger
      POSTGRES_DB: skyledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/home/postgres/pgdata
    # Published on this host's loopback only. Bring-your-own Grafana on another
    # machine: set DB_BIND=0.0.0.0 (it can only log in as the read-only role).
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyledger -d skyledger"]
      interval: 10s
      timeout: 5s
      retries: 30

  migrate:
    <<: *skyledger
    command: migrate
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy

  ingest:
    <<: *skyledger
    command: ingest
    healthcheck:
      # The ingester touches /tmp/ready after every successful write.
      test: ["CMD-SHELL", "test -n \"$(find /tmp/ready -mmin -2)\""]
      interval: 30s
      start_period: 60s

  history:
    <<: *skyledger
    command: history

  grafana:
    image: grafana/grafana:13.2.2
    profiles: [grafana]
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/skyledger-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Synthetic receiver for trying skyledger without one:
  #   TAR1090_URL=http://demo-feed:8080/ and COMPOSE_PROFILES=grafana,demo
  demo-feed:
    image: ghcr.io/d1srupt3d/skyledger:${SKYLEDGER_VERSION:-0.2}
    profiles: [demo]
    restart: unless-stopped
    command: ["demo-feed", "--port", "8080"]
    read_only: true
    cap_drop: [ALL]

volumes:
  db:
  grafana:
